name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Windows 构建（单测 + Clippy + Release）
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 工具链（stable + Windows target）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: 核心层单元测试
        run: cargo test -p ytdlp-core

      - name: Clippy 质量门禁（-D warnings）
        run: cargo clippy -p ytdlp-core --all-targets -- -D warnings

      - name: Clippy 质量门禁（GUI crate，-D warnings）
        run: cargo clippy -p ytdlp-gui --all-targets -- -D warnings

      - name: 依赖审计（信息性；发现公告不阻塞构建）
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit

      # 图标是编译期嵌进 exe 的 Windows 资源。cargo 按 build script 声明的
      # rerun-if-changed 判断是否重跑，而 tauri-build 不声明图标；rust-cache 恢复
      # target/ 后旧的资源与产物会被判定为"最新"并被复用，导致 exe 图标永远是旧的。
      # 构建前清理 GUI crate 产物，强制重新生成资源。（build.rs 已另加图标声明）
      - name: 清除 GUI crate 增量产物（避免旧的 Windows 图标资源被缓存复用）
        run: cargo clean -p ytdlp-gui

      - name: Release 构建
        run: cargo build --release

      - name: 校验产物
        shell: pwsh
        run: |
          $Exe = "target\release\ytdlp-FFmpeg-GUI.exe"
          if (-not (Test-Path $Exe)) { throw "缺少产物 $Exe" }
          Write-Host "产物大小: $([math]::Round((Get-Item $Exe).Length/1MB,1)) MB"

      - name: 上传产物（PR 调试用）
        uses: actions/upload-artifact@v7
        with:
          name: ytdlp-FFmpeg-GUI-win64
          path: target/release/ytdlp-FFmpeg-GUI.exe
          if-no-files-found: error
