name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # 跳过仓库的 rust-toolchain.toml：它额外声明了 x86_64-unknown-linux-gnu target
  # （供 Linux 上跑核心层单测），Windows runner 上会被 rustup 白白下载一份 rust-std。
  # 本 workflow 只产出 Windows 产物，工具链与 components 已由 dtolnay/rust-toolchain 装好。
  RUSTUP_TOOLCHAIN: stable

jobs:
  # 门禁与构建拆成两个 job：cargo test 产出 .rlib、cargo clippy 需要 .rmeta，两者指纹
  # 不同，放在同一个 job 里顺序执行会把整棵依赖树重新 check 一遍。拆开后每个 job 只
  # 固定用一种 profile，rust-cache 命中率才稳定（缓存 key 按 job 区分，互不影响）。
  lint:
    name: 质量门禁（单测 + Clippy + 依赖审计）
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 工具链（stable + rustfmt + clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: 核心层单元测试
        run: cargo test -p ytdlp-core

      - name: Clippy 质量门禁（核心层，-D warnings）
        run: cargo clippy -p ytdlp-core --all-targets -- -D warnings

      - name: Clippy 质量门禁（GUI crate，-D warnings）
        run: cargo clippy -p ytdlp-gui --all-targets -- -D warnings

      - name: 安装 cargo-audit（预编译二进制；不再每次从源码编译）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
        continue-on-error: true

      - name: 依赖审计（信息性；未安装或发现公告都不阻塞）
        continue-on-error: true
        run: cargo audit

  build:
    name: Windows Release 构建（单 EXE）
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # 只构建，不需要 rustfmt / clippy 组件。targets 显式写出 Windows 目标，
      # 不依赖 dtolnay/rust-toolchain 的 host-target 默认行为——打包单 EXE 靠它。
      - name: 安装 Rust 工具链（stable + Windows x86_64-msvc 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2.9.2

      # 图标是编译期嵌进 exe 的 Windows 资源。cargo 按 build script 声明的
      # rerun-if-changed 判断是否重跑，而 tauri-build 不声明图标；rust-cache 恢复
      # target/ 后旧的资源与产物会被判定为"最新"并被复用，导致 exe 图标永远是旧的。
      # 构建前清理 GUI crate 产物，强制重新生成资源。（build.rs 已另加图标声明）
      - name: 清除 GUI crate 增量产物（避免旧的 Windows 图标资源被缓存复用）
        run: cargo clean -p ytdlp-gui

      - name: Release 构建
        run: cargo build --release

      - name: 校验产物
        shell: pwsh
        run: |
          $Exe = "target\release\ytdlp-FFmpeg-GUI.exe"
          if (-not (Test-Path $Exe)) { throw "缺少产物 $Exe" }
          Write-Host "产物大小: $([math]::Round((Get-Item $Exe).Length/1MB,1)) MB"

      - name: 上传产物（PR 调试用）
        uses: actions/upload-artifact@v7
        with:
          name: ytdlp-FFmpeg-GUI-win64
          path: target/release/ytdlp-FFmpeg-GUI.exe
          if-no-files-found: error
